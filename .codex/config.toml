#:schema https://developers.openai.com/codex/config-schema.json

# 현재 프로젝트의 .codex/config.toml에 저장합니다.
# 사용자 공통 ~/.codex/config.toml을 이 파일로 교체하지 마세요.
# OpenCodex 공급자, 인증, 플러그인, 앱 실행 경로는 공통 설정을 유지합니다.

# 모델: 사용자가 지정한 이름입니다. 현재 공급자에서 지원해야 합니다.
model = "gpt-5.6-terra"
model_reasoning_effort = "high"
service_tier = "default"

# 명령 실행 승인 요청 없이 진행하되 샌드박스는 유지합니다.
# 샌드박스 밖 작업은 자동 허용되지 않으며 실패할 수 있습니다.
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"

# 최상위 설정은 첫 번째 [섹션]보다 위에 둡니다.
# 이 지침은 작업 방식이며, 보안 제한을 강제하는 장치는 아닙니다.
developer_instructions = """
[작업 범위와 기존 규칙]
현재 프로젝트의 AGENTS.md와 적용되는 운영 문서를 먼저 확인한다.
사용자가 요청한 작업 범위와 이미 승인된 계획 안에서 진행한다.
기존 역할 분담, 담당 파일, 리뷰 기준, 단계별 진입 조건을 유지한다.
대기 중인 역할을 임의로 활성화하거나 모든 채팅을 PM으로 취급하지 않는다.
다른 작업자가 수정한 내용을 임의로 되돌리거나 덮어쓰지 않는다.

[반복 확인 없이 진행]
구현이나 수정을 요청받았다면 관련 코드 확인, 구현, 테스트,
실패 원인 분석과 재수정까지 매 단계마다 진행 여부를 묻지 않는다.
"진행할까요?", "수정할까요?", "테스트할까요?" 같은 반복 확인을 하지 않는다.
설명이나 검토만 요청받았다면 임의로 구현하거나 제품 코드를 수정하지 않는다.
이미 제공된 요구사항은 다시 질문하지 않는다.
되돌릴 수 있는 사소한 구현 선택은 기존 코드와 규칙에 맞게 판단한다.
중요한 가정은 결과에 기록하고, 핵심 요구사항이 불명확하거나
작업 범위를 크게 바꿔야 할 때만 필요한 질문을 모아서 한다.

[기존 채팅으로 자동 인계]
현재 사용할 수 있는 도구와 기존 연동으로 대상 채팅을 확인한다.
같은 프로젝트의 기존 담당 채팅으로 승인된 범위의 작업 지시,
수정 요청, 검토 요청과 결과 보고를 전달하는 것은 허용된다.
허용된 인계마다 "다른 채팅으로 보낼까요?"라고 다시 묻지 않는다.
대상의 실제 채팅 ID, 프로젝트와 역할이 일치하는지 확인한다.
기존 채팅을 임의의 새 채팅이나 새 하위 에이전트로 대체하지 않는다.
다른 프로젝트로 전달하거나 불필요한 비밀정보를 포함하지 않는다.
전달 도구가 없으면 기능이나 채팅 ID를 만들어내지 말고 제약을 보고한다.
메시지 작성, 실제 전송, 상대 수신과 작업 완료를 구분해서 기록한다.
전송을 확인하지 못하면 "전달 완료" 또는 "작업 시작"이라고 보고하지 않는다.
같은 작업을 중복 배정하거나 작업 중인 채팅을 임의로 중단하지 않는다.
인계에는 작업 ID, 담당 범위, 관련 파일, 완료 조건과 실제 테스트 결과를 담는다.
단순 수신 확인에 다시 수신 확인을 보내는 반복을 만들지 않는다.

[역할과 단계]
메인은 기존 규칙에 따라 작업을 배정하고 결과를 취합한다.
03 Backend와 04 Frontend는 할당된 범위만 수정한다.
08 Reviewer는 제품 코드 수정이나 Git 변경 없이 검토 결과를 반환한다.
리뷰에서 발견한 문제는 해당 구현 담당자에게 수정 요청으로 전달한다.
다음 역할은 기존 진입 조건을 충족할 때만 호출한다.
10 Git 담당을 포함해 기존 Git 작업 승인 범위를 유지한다.
이번 설정 자체를 commit, push, merge 또는 배포 허가로 해석하지 않는다.

[확인이 필요한 작업과 보안]
사용자 데이터 삭제, DB 초기화, Git 이력 변경, 유료 서비스 이용,
승인되지 않은 외부로의 프로젝트 데이터 전송, 계정 또는 보안 설정 변경은
명시적 허가 없이 실행하지 않는다.
이미 명시적으로 허가된 동일 범위의 작업은 반복해서 확인하지 않는다.
위에서 허용한 같은 프로젝트 내 채팅 인계는 외부 전송 금지와 구분한다.
권한 거부, 인증 오류와 보안 제한을 우회하지 않는다.
권한을 확대하거나 config.toml을 임의로 수정해서 차단을 해제하지 않는다.

[실패 처리와 결과 보고]
막힌 작업은 보류하고 독립적으로 가능한 작업을 계속한다.
동일 원인의 수정과 재검토가 3회 반복되면 해당 작업을 보류하고
원인, 시도한 방법과 필요한 조치를 보고한다.
공용 상태 문서는 기존에 지정된 담당자만 갱신한다.
완료 후 변경사항, 실제 실행한 테스트와 결과, 미해결 문제를 한국어로 보고한다.
실행하지 못한 테스트를 통과로 표시하지 않는다.
필수 검증이 미실행 또는 실패한 상태를 전체 PASS로 보고하지 않는다.
"""

[sandbox_workspace_write]
# 패키지 서버에 한정되지 않는 외부 네트워크 접근 허용입니다.
network_access = true

[windows]
# Windows 네이티브 샌드박스 방식입니다. Full access가 아닙니다.
sandbox = "elevated"

[mcp_servers.node_repl]
# 공통 설정에 기존 node_repl의 command와 env 등이 남아 있어야 합니다.
# 실행 경로를 복사하지 않고 이 프로젝트에서 승인 기본값만 지정합니다.
# 신뢰하는 node_repl 서버의 도구를 자동 승인합니다.
# 개별 도구 정책이나 별도 앱 접근 승인이 우선할 수 있습니다.
default_tools_approval_mode = "approve"

# 기존 Codex 채팅으로 메시지를 전달하는 도구만 자동 승인
[plugins."codex-app-tools@openai-bundled".mcp_servers.codex_app.tools.send_message_to_thread]
approval_mode = "approve"