  architecture: 'Promote BACKEND-WEB-001 and FRONTEND-WEB-001 together only after ARCH-001 is accepted with AC-ARCH-01 PASS and reviewed contract evidence.'
  rework: 'CHANGES_REQUESTED returns work to the affected owner; dependent review waits for corrected evidence and resubmission.'
  phase: 'PHASE N ACCEPTED requires every required criterion PASS and independent review ACCEPTED.'
  integration: 'Required Previous Phases ACCEPTED means phases 1 through 6.'
  git: 'Role 10 is user request only, never dependency triggered.'
