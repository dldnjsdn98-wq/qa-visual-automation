schema_version: 1
dependency_rules:
  task: Satisfied only when referenced task is ACCEPTED, MERGED or DONE with acceptance evidence.
  review: 'Review tasks are an exception: activate when every referenced implementation task is READY_FOR_REVIEW with owner evidence; prior acceptance
    is not required to begin review.'
  architecture: Promote BACKEND-WEB-001 and FRONTEND-WEB-001 together only after ARCH-001 is accepted with AC-ARCH-01 PASS and reviewed contract
    evidence.
  rework: CHANGES_REQUESTED returns work to the affected owner; dependent review waits for corrected evidence and resubmission.
  phase: PHASE N ACCEPTED requires every required criterion PASS and independent review ACCEPTED.
  integration: Required Previous Phases ACCEPTED means phases 1 through 6.
  git: Role 10 is user request only, never dependency triggered.
  phase2_contract: ARCH-UPLOAD-001 and REVIEW-ARCH-UPLOAD-001 ACCEPTED/DONE with exact revision, own preparation accepted and file ownership confirmed;
    PM promotes Backend and uploader together.
  phase2_submission_entry: Phase2 review and FRONTEND-UPLOAD-VERIFY-001 use explicit entry_condition with READY_FOR_REVIEW submissions (or accepted
    evidence), not prior implementation acceptance; PM activation required.
